<!-- begin post -->
{% assign author = site.authors[post.author] %}

<div class="col-md-4 grid-item">
  <article class="card post-card">
    {% if post.image %}
    <a href="{{ post.url | relative_url }}">
      <img
        class="img-fluid"
        src="{{ site.baseurl }}/{{ post.image }}"
        alt="{{ post.title }}"
      />
    </a>
    {% endif %}
    <div class="card-block">
      <div class="post-tags">
        <a href="{{ site.baseurl }}/category/{{ post.category | slugify }}/">{{ post.category }}</a>
        <span>{{ post.date | date_to_string }}</span>
      </div>
      <h2 class="card-title">
        <a href="{{ post.url | relative_url }}">{{ post.title }}</a>
      </h2>
      <h4 class="card-text">
        {{ post.excerpt | strip_html | truncatewords: 30 }}
      </h4>
      <div class="metafooter">
        <div class="wrapfooter">
          {% if post.author %}
          <span class="meta-footer-thumb">
            <img
              class="author-thumb"
              src="https://www.gravatar.com/avatar/{{
                author.gravatar
              }}?s=250&d=mm&r=x"
              alt="{{ author.display_name }}"
            />
          </span>
          <span class="author-meta">
            <span class="post-name">
              <a target="_blank" href="{{ author.web }}">{{
                author.display_name
              }}</a>
            </span>
            <br />
            {% endif %}
          </span>
          <span class="post-read-more postbox">
            <!-- Post Categories -->
            <div class="after-post-tags">
              <ul class="tags postbox">
                <li>
                  <a
                    href="{{ site.baseurl }}/category/{{
                      post.category | slugify
                    }}/"
                    >{{ post.category }}</a
                  >
                </li>
              </ul>
            </div>
          </span>
          <div class="clearfix"></div>
        </div>
      </div>
    </div>
  </article>
</div>
<!-- end post -->
